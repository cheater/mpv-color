# Color controls (colors.lua)

# Continuous Adjustments (Hold key down for repeat)
F1 repeatable script-message adjust_brightness_down
F2 repeatable script-message adjust_brightness_up
F3 repeatable script-message adjust_contrast_down
F4 repeatable script-message adjust_contrast_up
F5 repeatable script-message adjust_gamma_down
F6 repeatable script-message adjust_gamma_up

# Mode Selectors
F9  script-message set_mode_all
F10 script-message set_mode_red
F11 script-message set_mode_green
F12 script-message set_mode_blue

# Reset All Shortcut
Shift+F9 script-message reset_all

# Individual Resets
Shift+F1 script-message reset_brightness
Shift+F3 script-message reset_contrast
Shift+F5 script-message reset_gamma

# Saturation is only handled for all channels, not for R G B selectively. Per-channel contrast is saturation... I think.
F7 add saturation -1
F8 add saturation 1
Shift+F7 set saturation 0
